<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المخزن</title>
  <style>
    body { font-family: Arial; direction: rtl; text-align: center; background: #f5f5f5; }
    .form-box { max-width: 400px; margin: 50px auto; padding: 20px; background: white; border: 1px solid #ccc; border-radius: 10px; }
    input { margin: 5px; padding: 8px; width: 90%; }
    button { margin-top: 10px; padding: 10px; width: 100%; background: green; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>المخزن</h2>
    <form id="saveForm">
      <input type="text" id="name" placeholder="اسم المادة" required />
      <input type="text" id="color" placeholder="اللون" required />
      <input type="number" id="totalQty" placeholder="الكمية الكلية" required />

      <label>القياسات</label>
      <div>
        M: <input type="number" id="M" value="0" />
        L: <input type="number" id="L" value="0" />
        XL: <input type="number" id="XL" value="0" />
        XXL: <input type="number" id="XXL" value="0" />
        3XL: <input type="number" id="3XL" value="0" />
      </div>

      <button type="submit">حفظ</button>
    </form>
  </div>

  <script>
    document.getElementById("saveForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const color = document.getElementById("color").value;
      const totalQty = document.getElementById("totalQty").value;
      const sizes = {
        M: document.getElementById("M").value,
        L: document.getElementById("L").value,
        XL: document.getElementById("XL").value,
        XXL: document.getElementById("XXL").value,
        "3XL": document.getElementById("3XL").value,
      };

      try {
        const res = await fetch("/save-item", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, color, totalQty, sizes }),
        });

        const data = await res.json();
        if (data.success) {
          alert("✅ تم الحفظ بنجاح!");
        } else {
          alert("⚠️ خطأ: " + data.message);
        }
      } catch (err) {
        alert("❌ خطأ في الاتصال بالسيرفر");
      }
    });
  </script>
</body>
</html>
