<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المخزن</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #333; }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button, select {
      margin: 10px 0;
      padding: 8px;
      width: 90%;
      font-size: 16px;
    }
    .sizes {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .sizes div {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 14px;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>المخزن</h1>
  <div class="box">
    <input type="text" id="itemName" placeholder="اسم المادة">
    <input type="color" id="itemColor" value="#000000">
    <input type="number" id="totalQty" placeholder="الكمية الكلية">

    <div class="sizes">
      <div><label>M</label><input type="number" id="qtyM" placeholder="العدد"></div>
      <div><label>L</label><input type="number" id="qtyL" placeholder="العدد"></div>
      <div><label>XL</label><input type="number" id="qtyXL" placeholder="العدد"></div>
      <div><label>XXL</label><input type="number" id="qtyXXL" placeholder="العدد"></div>
      <div><label>3XL</label><input type="number" id="qty3XL" placeholder="العدد"></div>
    </div>

    <button onclick="saveItem()">💾 حفظ</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    async function saveItem() {
      const name = document.getElementById('itemName').value;
      const color = document.getElementById('itemColor').value;
      const total = parseInt(document.getElementById('totalQty').value) || 0;

      const qtyM = parseInt(document.getElementById('qtyM').value) || 0;
      const qtyL = parseInt(document.getElementById('qtyL').value) || 0;
      const qtyXL = parseInt(document.getElementById('qtyXL').value) || 0;
      const qtyXXL = parseInt(document.getElementById('qtyXXL').value) || 0;
      const qty3XL = parseInt(document.getElementById('qty3XL').value) || 0;

      const sum = qtyM + qtyL + qtyXL + qtyXXL + qty3XL;
      const msgBox = document.getElementById('message');

      if (!name || total <= 0) {
        msgBox.innerHTML = "⚠️ يرجى إدخال اسم المادة والكمية الكلية.";
        msgBox.style.color = "red";
        return;
      }

      if (sum !== total) {
        msgBox.innerHTML = "⚠️ المجموع (" + sum + ") لا يساوي الكمية الكلية (" + total + ")";
        msgBox.style.color = "red";
        return;
      }

      try {
        const res = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            color,
            total,
            sizes: { M: qtyM, L: qtyL, XL: qtyXL, XXL: qtyXXL, "3XL": qty3XL }
          })
        });

        const data = await res.json();

        if (res.ok) {
          msgBox.innerHTML = "✅ تم الحفظ: " + data.message;
          msgBox.style.color = "green";
        } else {
          msgBox.innerHTML = "❌ خطأ: " + data.error;
          msgBox.style.color = "red";
        }
      } catch (err) {
        msgBox.innerHTML = "❌ خطأ في الاتصال بالسيرفر";
        msgBox.style.color = "red";
      }
    }
  </script>

</body>
</html>
