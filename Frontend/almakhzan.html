<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المخزن</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: green;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: darkgreen;
    }
    .sizes {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .sizes input {
      width: 50px;
    }
    .message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>المخزن</h2>
    <input type="text" id="name" placeholder="اسم المادة" required>
    
    <label>اللون:</label>
    <input type="color" id="color" value="#000000">

    <input type="number" id="quantity" placeholder="الكمية الكلية" required>

    <div class="sizes">
      <div>
        <label>M</label>
        <input type="number" id="sizeM" value="0">
      </div>
      <div>
        <label>L</label>
        <input type="number" id="sizeL" value="0">
      </div>
      <div>
        <label>XL</label>
        <input type="number" id="sizeXL" value="0">
      </div>
      <div>
        <label>XXL</label>
        <input type="number" id="sizeXXL" value="0">
      </div>
      <div>
        <label>3XL</label>
        <input type="number" id="size3XL" value="0">
      </div>
    </div>

    <button onclick="saveItem()">حفظ</button>
    <div class="message" id="message"></div>
  </div>

  <script>
    async function saveItem() {
      const name = document.getElementById("name").value;
      const color = document.getElementById("color").value;
      const quantity = document.getElementById("quantity").value;

      const sizes = {
        M: document.getElementById("sizeM").value,
        L: document.getElementById("sizeL").value,
        XL: document.getElementById("sizeXL").value,
        XXL: document.getElementById("sizeXXL").value,
        "3XL": document.getElementById("size3XL").value
      };

      try {
        const res = await fetch("/add-item", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, color, quantity, sizes })
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById("message").innerHTML = "✅ " + data.message;
          document.getElementById("message").style.color = "green";
        } else {
          document.getElementById("message").innerHTML = "❌ " + data.message;
          document.getElementById("message").style.color = "red";
        }
      } catch (err) {
        document.getElementById("message").innerHTML = "❌ خطأ في الاتصال بالسيرفر";
        document.getElementById("message").style.color = "red";
      }
    }
  </script>
</body>
</html>
